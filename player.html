<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فاطمة ورحلة الجملة الاسمية</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.25)}
#play div{width:18vmin;height:18vmin;border-radius:50%;background:#F28C28;box-shadow:0 0 0 1.2vmin rgba(255,255,255,.85),0 1vmin 3vmin rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#play:hover div{transform:scale(1.08)}
#play svg{width:45%;height:45%;margin-left:6%}
</style>
</head>
<body>
<video id="v" playsinline preload="auto"></video>
<div id="play" aria-label="تشغيل"><div><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z" fill="#fff"/></svg></div></div>
<script>
const s=(new URLSearchParams(location.search).get('s')||'1').replace(/\D/g,'')||'1';
const v=document.getElementById('v'),p=document.getElementById('play');
v.src='station'+s+'.mp4';
v.poster='station'+s+'.jpg';
function go(){p.style.display='none';v.controls=true;v.play();}
p.onclick=go;
v.onended=()=>{v.controls=true;};
v.onclick=()=>{if(v.paused)v.play();else v.pause();};
</script>
</body>
</html>
